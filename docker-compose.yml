services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: madeira_quintal
      POSTGRES_USER: madeira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madeira -d madeira_quintal"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Não expor a porta do banco na internet.
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://madeira:${POSTGRES_PASSWORD}@db:5432/madeira_quintal?schema=public
    ports:
      - "3000:3000"
volumes:
  postgres_data:
